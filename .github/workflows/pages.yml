# Publica no GitHub Pages apenas os arquivos do site
# (sem scripts/, functions/, docs/, regras do Firebase etc.).
name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar pasta do site
        run: |
          mkdir _site
          cp -r index.html .nojekyll admin css js qr assets _site/
          mkdir -p _site/data && cp data/menu.js _site/data/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
